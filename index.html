<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>GAME OVER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; background: #000; }
  body {
    font-family: "Courier New", Courier, monospace; background: #000; color: #b30000;
    display: flex; align-items: center; justify-content: center; position: relative;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; cursor: crosshair;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.6) 68%, rgba(0,0,0,0.97) 100%);
    transition: opacity 9s linear; animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }

  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px);
    mix-blend-mode: multiply; opacity: 0.7;
  }
  .flicker {
    position: fixed; inset: 0; pointer-events: none; z-index: 7;
    background: rgba(20,0,0,0.06); animation: flick 4s steps(2) infinite;
  }
  @keyframes flick { 0%,19%,21%,55%,57%,100% { opacity: 0.25; } 20%,56% { opacity: 0.65; } }

  .stage { position: relative; z-index: 3; text-align: center; padding: 18px; width: 100%; max-width: 640px; }

  .gameover {
    font-size: clamp(44px, 15vw, 130px); font-weight: 900; letter-spacing: 4px; color: #8b0000;
    text-shadow: 0 0 6px #ff0000, 0 0 22px rgba(255,0,0,0.55), 3px 0 0 #3a0000, -3px 0 0 #5a0000;
    position: relative; animation: pulseText 2.4s ease-in-out infinite;
  }
  @keyframes pulseText { 0%,100% { opacity: 0.82; transform: scale(1.00); } 50% { opacity: 1; transform: scale(1.02); } }
  .gameover::before, .gameover::after { content: "GAME OVER"; position: absolute; top: 0; left: 0; width: 100%; overflow: hidden; }
  .gameover::before { color: #00e0ff; left: 2px; text-shadow: none; animation: glitchTop 2.6s infinite linear alternate-reverse; opacity: 0.7; }
  .gameover::after { color: #ff003c; left: -2px; text-shadow: none; animation: glitchBot 1.9s infinite linear alternate-reverse; opacity: 0.7; }
  @keyframes glitchTop {
    0% { clip-path: inset(0 0 85% 0); transform: translate(0,0); } 20% { clip-path: inset(20% 0 55% 0); transform: translate(-3px,0); }
    40% { clip-path: inset(45% 0 35% 0); transform: translate(3px,0); } 60% { clip-path: inset(10% 0 75% 0); transform: translate(-2px,0); }
    80% { clip-path: inset(60% 0 20% 0); transform: translate(2px,0); } 100% { clip-path: inset(5% 0 80% 0); transform: translate(0,0); }
  }
  @keyframes glitchBot {
    0% { clip-path: inset(70% 0 5% 0); transform: translate(0,0); } 25% { clip-path: inset(80% 0 8% 0); transform: translate(3px,0); }
    50% { clip-path: inset(55% 0 30% 0); transform: translate(-3px,0); } 75% { clip-path: inset(88% 0 2% 0); transform: translate(2px,0); }
    100% { clip-path: inset(65% 0 12% 0); transform: translate(0,0); }
  }

  .blood { margin: 14px auto 0; width: 60%; height: 60px; position: relative; }
  .blood::before { content: ""; position: absolute; top: 0; left: 50%; width: 3px; height: 100%;
    background: linear-gradient(to bottom, rgba(255,0,0,0.0), #8b0000 40%, #5a0000); transform: translateX(-50%); animation: drip 3.2s ease-in infinite; }
  .blood::after { content: ""; position: absolute; top: 0; left: 30%; width: 2px; height: 70%;
    background: linear-gradient(to bottom, rgba(255,0,0,0.0), #7a0000); animation: drip 4.1s ease-in infinite 1.2s; }
  @keyframes drip { 0% { height: 0; opacity: 0; } 15% { opacity: 1; } 100% { height: 100%; opacity: 0.85; } }

  .you { margin-top: 26px; font-size: clamp(17px, 4.6vw, 30px); color: #c9c9c9; letter-spacing: 2px; text-shadow: 0 0 8px rgba(180,0,0,0.6); animation: flickerText 3.3s infinite; }
  @keyframes flickerText { 0%,18%,22%,25%,53%,57%,100% { opacity: 0.9; } 20%,24%,55% { opacity: 0.18; } 80% { opacity: 0.55; } }
  .you .em { color: #ff2b2b; text-shadow: 0 0 12px rgba(255,0,0,0.9); }

  .timer { margin-top: 18px; font-size: 13px; letter-spacing: 2px; color: #7a1010; text-shadow: 0 0 6px rgba(255,0,0,0.4); animation: pulseHint 2.4s ease-in-out infinite; }
  @keyframes pulseHint { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

  .whisper { margin-top: 16px; font-size: 13px; letter-spacing: 3px; color: #6a6a6a; min-height: 20px; text-transform: uppercase; transition: opacity 1.4s ease; }

  .hint { margin-top: 18px; font-size: 11px; color: #444; letter-spacing: 2px; animation: pulseHint 2s ease-in-out infinite; }

  .controls { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { appearance: none; border: 1px solid #5a0000; background: rgba(30,0,0,0.6); color: #c94a4a; font-family: inherit; font-size: 12px; letter-spacing: 2px; padding: 11px 16px; border-radius: 8px; cursor: pointer; text-transform: uppercase; text-shadow: 0 0 6px rgba(255,0,0,0.5); transition: all 0.18s ease; -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: scale(0.93); background: rgba(60,0,0,0.8); color: #ff5b5b; }
  .btn.find { border-color: #7a0000; color: #ff6a6a; }

  /* ── Dead eyes in the void ── */
  .eyes { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .eye { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #1a0000 0%, #000 60%); box-shadow: 0 0 4px #300; }
  .eye::after { content: ""; position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; background: #e8e8e8; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 8px #fff; opacity: 0; transition: opacity 0.18s ease; }
  .eye.open::after { opacity: 0.95; }

  /* ── The Watcher (approaches over time) ── */
  .watcher {
    position: fixed; left: 50%; bottom: -10%; transform: translateX(-50%) scale(0.35);
    z-index: 1; width: 46vw; max-width: 360px; pointer-events: none;
    opacity: 0; transition: transform 60s linear, opacity 6s ease;
    filter: blur(6px) contrast(1.4) brightness(0.5);
  }
  .watcher.show { opacity: 0.55; }
  .watcher svg { display: block; width: 100%; height: auto; }
  .watcher .weyes { animation: watcherBlink 6s infinite; transform-origin: center; }

  /* ── Subliminal face flashes ── */
  .sublime { position: fixed; inset: 0; z-index: 80; pointer-events: none; display: none; align-items: center; justify-content: center; background: #000; }
  .sublime.on { display: flex; }
  .sublime svg { width: 60vw; max-width: 320px; height: auto; filter: drop-shadow(0 0 30px #400); opacity: 0.9; }

  .staticflash { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: rgba(255,255,255,0.05); opacity: 0; }

  .veil { position: fixed; inset: 0; z-index: 50; background: #000; color: #5a0000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; cursor: pointer; padding: 24px; }
  .veil .big { font-size: clamp(20px, 6vw, 34px); letter-spacing: 4px; color: #7a0000; text-shadow: 0 0 10px rgba(255,0,0,0.4); animation: pulseText 2s ease-in-out infinite; }
  .veil .small { font-size: 12px; color: #555; letter-spacing: 2px; }

  /* ── JUMPSCARE ── */
  .scare { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; background: #000; pointer-events: none; }
  .scare.on { display: flex; animation: scareShake 0.07s infinite; }
  .scare svg { width: 88vw; max-width: 520px; height: auto; filter: drop-shadow(0 0 50px #ff0000); animation: scareZoom 0.6s ease-out forwards; }
  @keyframes scareZoom { 0% { transform: scale(0.15) rotate(-8deg); opacity: 0; } 10% { transform: scale(1.2) rotate(4deg); opacity: 1; } 100% { transform: scale(1.5) rotate(-2deg); opacity: 1; } }
  @keyframes scareShake { 0% { transform: translate(0,0); } 25% { transform: translate(-14px,10px); } 50% { transform: translate(12px,-9px); } 75% { transform: translate(-10px,-12px); } 100% { transform: translate(11px,8px); } }
  .scare .redflash { position: absolute; inset: 0; background: #ff0000; opacity: 0; mix-blend-mode: screen; animation: redFlash 0.6s ease-out forwards; }
  @keyframes redFlash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
  .scare .glitchbar { position: absolute; left: 0; width: 100%; height: 3px; background: #fff; opacity: 0.7; animation: barJump 0.12s infinite; }
  @keyframes barJump { 0% { top: 10%; } 50% { top: 60%; } 100% { top: 88%; } }
</style>
</head>
<body>

<!-- dead eyes in the void -->
<div class="eyes" id="eyes"></div>

<!-- the approaching watcher -->
<div class="watcher" id="watcher">
  <svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="wg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2a0000"/><stop offset="60%" stop-color="#0c0000"/><stop offset="100%" stop-color="#000"/>
    </radialGradient></defs>
    <ellipse cx="100" cy="150" rx="70" ry="120" fill="url(#wg)"/>
    <g class="weyes" fill="#000">
      <ellipse cx="74" cy="120" rx="16" ry="26"/>
      <ellipse cx="126" cy="120" rx="16" ry="26"/>
    </g>
    <circle cx="74" cy="124" r="4" fill="#b30000"/>
    <circle cx="126" cy="124" r="4" fill="#b30000"/>
    <path d="M60 230 Q100 270 140 230 Q100 250 60 230 Z" fill="#1a0000"/>
    <path d="M82 235 Q100 300 118 235 Q100 255 82 235 Z" fill="#3a0000"/>
  </svg>
</div>

<div class="stage" id="stage">
  <div class="gameover">GAME OVER</div>
  <div class="blood"></div>
  <div class="you">you did this to <span class="em">yourself</span></div>
  <div class="timer" id="timer">you have been here 0:00</div>
  <div class="whisper" id="whisper"></div>
  <div class="hint">[ tap anywhere — it is listening ]</div>
  <div class="controls">
    <button class="btn find" id="findBtn">👁 let it find you</button>
    <button class="btn" id="shareBtn">share the curse</button>
  </div>
</div>

<!-- subliminal flashes -->
<div class="sublime" id="sublime"><svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="100" cy="120" rx="84" ry="104" fill="#d8d4cc"/>
  <ellipse cx="70" cy="100" rx="18" ry="28" fill="#000"/>
  <ellipse cx="130" cy="100" rx="18" ry="28" fill="#000"/>
  <circle cx="70" cy="106" r="4" fill="#5a0000"/><circle cx="130" cy="106" r="4" fill="#5a0000"/>
  <path d="M40 200 Q100 150 160 200 Q100 240 40 200 Z" fill="#111"/>
  <path d="M78 200 L100 168 L122 200 L100 216 Z" fill="#000"/>
</svg></div>

<!-- jumpscare -->
<div class="scare" id="scare">
  <div class="redflash"></div>
  <div class="glitchbar"></div>
  <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="110" cy="130" rx="92" ry="112" fill="#cfc9bf"/>
    <path d="M20 120 Q110 30 200 120 Q110 70 20 120 Z" fill="#1a0000"/>
    <ellipse cx="74" cy="112" rx="26" ry="34" fill="#000"/>
    <ellipse cx="146" cy="112" rx="26" ry="34" fill="#000"/>
    <circle cx="74" cy="118" r="7" fill="#b30000"/><circle cx="146" cy="118" r="7" fill="#b30000"/>
    <path d="M40 150 Q110 120 180 150 Q110 172 40 150 Z" fill="#2a0000"/>
    <path d="M55 175 L110 250 L165 175 Q110 210 55 175 Z" fill="#000"/>
    <path d="M70 180 L110 245 L90 200 Z" fill="#fff"/><path d="M150 180 L110 245 L130 200 Z" fill="#fff"/>
    <path d="M60 178 L88 196 L78 178 Z" fill="#fff"/><path d="M160 178 L132 196 L142 178 Z" fill="#fff"/>
  </svg>
</div>

<div class="staticflash" id="staticflash"></div>
<div class="scanlines"></div>
<div class="flicker"></div>
<div class="vignette"></div>

<div class="veil" id="veil">
  <div class="big">DO NOT OPEN</div>
  <div class="small">tap if you must</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const whisperEl = document.getElementById('whisper');
  const timerEl = document.getElementById('timer');
  const flash = document.getElementById('staticflash');
  const veil = document.getElementById('veil');
  const scare = document.getElementById('scare');
  const findBtn = document.getElementById('findBtn');
  const shareBtn = document.getElementById('shareBtn');
  const sublime = document.getElementById('sublime');
  const watcher = document.getElementById('watcher');

  let dreadLevel = 0; // 0..1 escalates over time

  // ── Dead eyes scattered in the void ──
  const eyesWrap = document.getElementById('eyes');
  const eyeList = [];
  for (let i = 0; i < 7; i++) {
    const e = document.createElement('div');
    e.className = 'eye';
    e.style.left = (8 + Math.random()*84) + 'vw';
    e.style.top = (6 + Math.random()*88) + 'vh';
    e.style.transform = 'scale(' + (0.6 + Math.random()*1.1) + ')';
    eyesWrap.appendChild(e);
    eyeList.push(e);
  }
  function blinkEyes() {
    const e = eyeList[Math.floor(Math.random()*eyeList.length)];
    e.classList.add('open');
    setTimeout(() => e.classList.remove('open'), 350 + Math.random()*400);
    setTimeout(blinkEyes, 2200 + Math.random()*5200);
  }
  setTimeout(blinkEyes, 1500);

  // ── Whispers ──
  const lines = [
    "behind you", "it already knows", "you left the door open", "they are counting",
    "don't look up", "this was always the ending", "it hears the screen",
    "you can still feel it", "no one is coming", "the numbers were never yours",
    "it can see you through the glass", "you were the last one", "it is still in the room",
    "closer now", "do not turn around"
  ];
  function whisperLoop() {
    const l = lines[Math.floor(Math.random()*lines.length)];
    whisperEl.style.opacity = '0';
    setTimeout(() => { whisperEl.textContent = l; whisperEl.style.opacity = '0.8'; }, 300);
    setTimeout(() => { whisperEl.style.opacity = '0'; }, 2600);
    setTimeout(whisperLoop, 4000 + Math.random()*3500);
  }
  whisperLoop();

  // ── Static flash ──
  function flashLoop() {
    flash.style.opacity = (0.04 + Math.random()*0.12 + dreadLevel*0.15).toFixed(3);
    setTimeout(() => flash.style.opacity = '0', 60 + Math.random()*90);
    setTimeout(flashLoop, 2500 + Math.random()*5000);
  }
  flashLoop();

  // ── Timer ──
  let seconds = 0, started = false;
  function fmt(s) { const m = Math.floor(s/60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function tickTimer() {
    seconds++;
    timerEl.textContent = 'you have been here ' + fmt(seconds);
    dreadLevel = Math.min(1, seconds / 120); // full dread at 2 minutes
    // escalate visuals
    document.documentElement.style.setProperty('--d', dreadLevel.toFixed(3));
    flash.style.opacity = (0.04 + dreadLevel*0.18).toFixed(3);
  }
  function startTimer() { if (!started) { started = true; setInterval(tickTimer, 1000); } }

  /* ── AUDIO ENGINE ── */
  let audioCtx = null, masterGain = null, audioReady = false, musicTimer = null;

  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function startDread() {
    ensureAudio();
    if (audioReady || !audioCtx) return;
    audioReady = true;
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    masterGain.connect(audioCtx.destination);
    masterGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 5);

    // low drone bed
    const osc = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const osc3 = audioCtx.createOscillator();
    const droneGain = audioCtx.createGain(); droneGain.gain.value = 0.18;
    osc.type = 'sine'; osc.frequency.value = 41;
    osc2.type = 'sine'; osc2.frequency.value = 54.5; // detuned — unease
    osc3.type = 'triangle'; osc3.frequency.value = 81.3;
    osc.connect(droneGain); osc2.connect(droneGain); osc3.connect(droneGain);
    droneGain.connect(masterGain);
    osc.start(); osc2.start(); osc3.start();

    // slow heartbeat
    let beat = 0;
    setInterval(() => { if (audioCtx) thump(beat % 2 === 0 ? 0.9 : 0.5); beat++; }, 1150);

    startMusicBox();
  }

  // creepy detuned music-box lullaby (synthesized)
  function startMusicBox() {
    // a minor-key childlike melody (semitone offsets from A3 ~ 220hz), with rests
    const A = 220, f = n => A * Math.pow(2, n/12);
    // notes: A, C, E, A(up), G#, E, C, B, A  ... eerie minor
    const seq = [
      [0, 0.5], [3, 0.5], [7, 0.5],
      [12, 0.7], [8, 0.5], [7, 0.5],
      [3, 0.5], [2, 0.5], [-1, 0.6],
      [0, 0.5], [3, 0.5], [7, 0.5],
      [12, 0.7], [11, 0.5], [7, 0.8],
      [3, 0.5], [0, 0.9]
    ];
    let i = 0;
    function playNote() {
      if (!audioCtx || !audioReady) return;
      const [semi, dur] = seq[i % seq.length];
      i++;
      const t = audioCtx.currentTime;
      // detune slowly for "out of tune" dread
      const detune = 1 + (Math.sin(t*0.3) * 0.012) + dreadLevel * 0.02;
      const freq = f(semi) * detune;
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      o2.type = 'sine'; o2.frequency.value = freq * 2.001; // metallic shimmer
      const ng = audioCtx.createGain(); ng.gain.value = 0.12;
      o.connect(g); o2.connect(ng); ng.connect(g); g.connect(masterGain);
      const peak = 0.18 + dreadLevel * 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
      o.start(t); o.stop(t + dur); o2.start(t); o2.stop(t + dur);
      musicTimer = setTimeout(playNote, dur * 1000 * (0.96 + Math.random()*0.12));
    }
    playNote();
  }

  function thump(vol) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 60; g.gain.value = 0;
    o.connect(g); g.connect(masterGain);
    const t = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(vol * 0.4, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.35);
    o.start(t); o.stop(t + 0.4);
  }

  function scream() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime, dur = 1.0;
    // distorted noise burst
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/data.length, 1.4);
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const ng = audioCtx.createGain(); ng.gain.value = 0.0;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 800;
    noise.connect(bp); bp.connect(ng); ng.connect(masterGain);
    ng.gain.setValueAtTime(1.0, t); ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.start(t); noise.stop(t + dur);
    // descending shriek
    const o = audioCtx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.8);
    const og = audioCtx.createGain(); og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
    o.connect(og); og.connect(masterGain); o.start(t); o.stop(t + 0.9);
  }

  /* ── SUBLIMINAL FACE FLASHES ── */
  let subCooldown = false;
  function subliminal() {
    if (subCooldown) return;
    subCooldown = true;
    sublime.classList.add('on');
    setTimeout(() => sublime.classList.remove('on'), 70 + Math.random()*60); // barely perceptible
    setTimeout(() => subCooldown = false, 4000 + Math.random()*6000);
  }
  function subliminalLoop() {
    if (Math.random() < (0.25 + dreadLevel*0.4)) subliminal();
    setTimeout(subliminalLoop, 6000 + Math.random()*9000);
  }
  setTimeout(subliminalLoop, 8000);

  /* ── THE WATCHER APPROACHES ── */
  setTimeout(() => { watcher.classList.add('show'); }, 14000);
  // keep scaling up slowly toward viewer as time passes
  setInterval(() => {
    if (!watcher.classList.contains('show')) return;
    const s = 0.35 + Math.min(0.7, seconds / 200);
    const bottom = -10 + Math.min(20, seconds / 12);
    watcher.style.transform = 'translateX(-50%) scale(' + s.toFixed(3) + ')';
    watcher.style.bottom = bottom.toFixed(1) + '%';
  }, 4000);

  /* ── JUMPSCARE ── */
  let scareCooldown = 0;
  function triggerScare() {
    if (scareCooldown > 0) return;
    scareCooldown = 5;
    scare.classList.add('on');
    scream();
    whisperEl.textContent = 'IT FOUND YOU';
    whisperEl.style.opacity = '0.9';
    setTimeout(() => { scare.classList.remove('on'); }, 650);
  }
  setInterval(() => { if (scareCooldown > 0) scareCooldown--; }, 1000);

  stage.addEventListener('pointerup', () => {
    ensureAudio();
    if (scareCooldown === 0 && Math.random() < 0.22) triggerScare();
  });

  /* ── SHARE ── */
  function makeCard() {
    const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, 1200, 630);
    const grad = x.createRadialGradient(600, 260, 60, 600, 260, 620);
    grad.addColorStop(0, 'rgba(40,0,0,0.5)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad; x.fillRect(0, 0, 1200, 630);
    x.textAlign = 'center';
    x.shadowColor = '#ff0000'; x.shadowBlur = 34; x.fillStyle = '#8b0000';
    x.font = '900 140px "Courier New", monospace'; x.fillText('GAME OVER', 600, 210);
    x.shadowBlur = 12; x.fillStyle = '#cccccc'; x.font = '44px "Courier New", monospace';
    x.fillText('you did this to yourself', 600, 300);
    x.fillStyle = '#ff2b2b'; x.font = '30px "Courier New", monospace';
    x.fillText('trapped for ' + fmt(seconds), 600, 360);
    x.fillStyle = '#555'; x.font = '24px "Courier New", monospace';
    x.fillText('[ there is no escape ]', 600, 430);
    return c;
  }
  shareBtn.addEventListener('click', async (e) => {
    e.stopPropagation(); ensureAudio();
    const c = makeCard();
    try {
      const blob = await new Promise(res => c.toBlob(res, 'image/png'));
      const file = new File([blob], 'game-over.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'GAME OVER', text: 'you did this to yourself' });
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'game-over.png';
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (err) {}
  });

  findBtn.addEventListener('click', (e) => { e.stopPropagation(); ensureAudio(); triggerScare(); });

  /* ── VEIL ── */
  function reveal() {
    veil.style.transition = 'opacity 0.8s ease'; veil.style.opacity = '0';
    setTimeout(() => veil.remove(), 850);
    startDread(); startTimer();
  }
  veil.addEventListener('click', reveal);
  veil.addEventListener('touchstart', ensureAudio, { passive: true });

  document.addEventListener('mousemove', () => {
    if (Math.random() > 0.985) {
      document.body.style.filter = 'hue-rotate(' + (Math.random()*40-20) + 'deg) contrast(1.2)';
      setTimeout(() => document.body.style.filter = '', 90);
    }
  });
</script>
</body>
</html>
