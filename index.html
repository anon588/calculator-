<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>GAME OVER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden; background: #000;
  }
  body {
    font-family: "Courier New", Courier, monospace;
    background: #000;
    color: #b30000;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    cursor: crosshair;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── Vignette ── */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.95) 100%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }

  /* ── CRT scanlines ── */
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px);
    mix-blend-mode: multiply;
  }
  .flicker {
    position: fixed; inset: 0; pointer-events: none; z-index: 7;
    background: rgba(20,0,0,0.06);
    animation: flick 4s steps(2) infinite;
  }
  @keyframes flick {
    0%,19%,21%,55%,57%,100% { opacity: 0.25; }
    20%,56% { opacity: 0.65; }
  }

  /* ── Stage ── */
  .stage {
    position: relative; z-index: 3;
    text-align: center; padding: 18px;
    width: 100%; max-width: 640px;
  }

  /* ── GAME OVER ── */
  .gameover {
    font-size: clamp(44px, 15vw, 130px);
    font-weight: 900; letter-spacing: 4px;
    color: #8b0000;
    text-shadow: 0 0 6px #ff0000, 0 0 22px rgba(255,0,0,0.55), 3px 0 0 #3a0000, -3px 0 0 #5a0000;
    position: relative;
    animation: pulseText 2.4s ease-in-out infinite;
  }
  @keyframes pulseText { 0%,100% { opacity: 0.82; transform: scale(1.00); } 50% { opacity: 1; transform: scale(1.02); } }
  .gameover::before, .gameover::after {
    content: "GAME OVER"; position: absolute; top: 0; left: 0; width: 100%; overflow: hidden;
  }
  .gameover::before {
    color: #00e0ff; left: 2px; text-shadow: none;
    animation: glitchTop 2.6s infinite linear alternate-reverse; opacity: 0.7;
  }
  .gameover::after {
    color: #ff003c; left: -2px; text-shadow: none;
    animation: glitchBot 1.9s infinite linear alternate-reverse; opacity: 0.7;
  }
  @keyframes glitchTop {
    0% { clip-path: inset(0 0 85% 0); transform: translate(0,0); }
    20% { clip-path: inset(20% 0 55% 0); transform: translate(-3px,0); }
    40% { clip-path: inset(45% 0 35% 0); transform: translate(3px,0); }
    60% { clip-path: inset(10% 0 75% 0); transform: translate(-2px,0); }
    80% { clip-path: inset(60% 0 20% 0); transform: translate(2px,0); }
    100% { clip-path: inset(5% 0 80% 0); transform: translate(0,0); }
  }
  @keyframes glitchBot {
    0% { clip-path: inset(70% 0 5% 0); transform: translate(0,0); }
    25% { clip-path: inset(80% 0 8% 0); transform: translate(3px,0); }
    50% { clip-path: inset(55% 0 30% 0); transform: translate(-3px,0); }
    75% { clip-path: inset(88% 0 2% 0); transform: translate(2px,0); }
    100% { clip-path: inset(65% 0 12% 0); transform: translate(0,0); }
  }

  /* ── Blood drip ── */
  .blood { margin: 14px auto 0; width: 60%; height: 60px; position: relative; }
  .blood::before {
    content: ""; position: absolute; top: 0; left: 50%; width: 3px; height: 100%;
    background: linear-gradient(to bottom, rgba(255,0,0,0.0), #8b0000 40%, #5a0000);
    transform: translateX(-50%); animation: drip 3.2s ease-in infinite;
  }
  .blood::after {
    content: ""; position: absolute; top: 0; left: 30%; width: 2px; height: 70%;
    background: linear-gradient(to bottom, rgba(255,0,0,0.0), #7a0000);
    animation: drip 4.1s ease-in infinite 1.2s;
  }
  @keyframes drip { 0% { height: 0; opacity: 0; } 15% { opacity: 1; } 100% { height: 100%; opacity: 0.85; } }

  /* ── The line ── */
  .you {
    margin-top: 26px; font-size: clamp(17px, 4.6vw, 30px); color: #c9c9c9;
    letter-spacing: 2px; text-shadow: 0 0 8px rgba(180,0,0,0.6);
    animation: flickerText 3.3s infinite;
  }
  @keyframes flickerText {
    0%,18%,22%,25%,53%,57%,100% { opacity: 0.9; } 20%,24%,55% { opacity: 0.18; } 80% { opacity: 0.55; }
  }
  .you .em { color: #ff2b2b; text-shadow: 0 0 12px rgba(255,0,0,0.9); }

  /* ── Timer ── */
  .timer {
    margin-top: 18px; font-size: 13px; letter-spacing: 2px; color: #7a1010;
    text-shadow: 0 0 6px rgba(255,0,0,0.4); animation: pulseHint 2.4s ease-in-out infinite;
  }

  /* ── Sub whispers ── */
  .whisper {
    margin-top: 16px; font-size: 13px; letter-spacing: 3px; color: #6a6a6a;
    min-height: 20px; text-transform: uppercase; transition: opacity 1.4s ease;
  }

  /* ── Press anything ── */
  .hint { margin-top: 18px; font-size: 11px; color: #444; letter-spacing: 2px; animation: pulseHint 2s ease-in-out infinite; }
  @keyframes pulseHint { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

  /* ── Buttons ── */
  .controls { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 1px solid #5a0000; background: rgba(30,0,0,0.6);
    color: #c94a4a; font-family: inherit; font-size: 12px; letter-spacing: 2px;
    padding: 11px 16px; border-radius: 8px; cursor: pointer; text-transform: uppercase;
    text-shadow: 0 0 6px rgba(255,0,0,0.5); transition: all 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.93); background: rgba(60,0,0,0.8); color: #ff5b5b; }
  .btn.find { border-color: #7a0000; color: #ff6a6a; }

  /* ── Start veil ── */
  .veil {
    position: fixed; inset: 0; z-index: 50; background: #000; color: #5a0000;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 18px; text-align: center; cursor: pointer; padding: 24px;
  }
  .veil .big {
    font-size: clamp(20px, 6vw, 34px); letter-spacing: 4px; color: #7a0000;
    text-shadow: 0 0 10px rgba(255,0,0,0.4); animation: pulseText 2s ease-in-out infinite;
  }
  .veil .small { font-size: 12px; color: #555; letter-spacing: 2px; }

  /* ── Static flash ── */
  .staticflash { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: rgba(255,255,255,0.05); opacity: 0; }

  /* ── Faint breathing figure ── */
  .figure {
    position: fixed; right: 6%; bottom: 4%; z-index: 2; width: 120px; height: 200px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 25%, rgba(40,0,0,0.55) 0%, rgba(20,0,0,0.25) 35%, transparent 70%);
    border-radius: 50% 50% 45% 45%; filter: blur(3px); animation: figBreathe 6s ease-in-out infinite; opacity: 0.0;
  }
  @keyframes figBreathe { 0%,100% { transform: scaleY(1); opacity: 0.35; } 50% { transform: scaleY(1.06); opacity: 0.6; } }
  .figure::before, .figure::after {
    content: ""; position: absolute; top: 26%; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,0,0,0.7); box-shadow: 0 0 10px rgba(255,0,0,0.8); animation: blink 5s ease-in-out infinite;
  }
  .figure::before { left: 32%; } .figure::after { left: 58%; }
  @keyframes blink { 0%,92%,100% { opacity: 0.75; } 95% { opacity: 0.05; } }

  /* ── JUMPSCARE ── */
  .scare {
    position: fixed; inset: 0; z-index: 90; display: none;
    align-items: center; justify-content: center; background: #000;
    pointer-events: none;
  }
  .scare.on { display: flex; animation: scareShake 0.08s infinite; }
  .scare svg { width: 78vw; max-width: 420px; height: auto; filter: drop-shadow(0 0 40px #ff0000); animation: scareZoom 0.7s ease-out forwards; }
  @keyframes scareZoom { 0% { transform: scale(0.2) rotate(-6deg); opacity: 0; } 12% { transform: scale(1.15) rotate(3deg); opacity: 1; } 100% { transform: scale(1.4) rotate(-2deg); opacity: 1; } }
  @keyframes scareShake {
    0% { transform: translate(0,0); } 25% { transform: translate(-10px,8px); }
    50% { transform: translate(9px,-7px); } 75% { transform: translate(-7px,-9px); } 100% { transform: translate(8px,6px); }
  }
  .scare .redflash {
    position: absolute; inset: 0; background: #ff0000; opacity: 0; mix-blend-mode: screen;
    animation: redFlash 0.7s ease-out forwards;
  }
  @keyframes redFlash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div class="figure"></div>

<div class="stage" id="stage">
  <div class="gameover">GAME OVER</div>
  <div class="blood"></div>
  <div class="you">you did this to <span class="em">yourself</span></div>
  <div class="timer" id="timer">you have been here 0:00</div>
  <div class="whisper" id="whisper"></div>
  <div class="hint">[ tap anywhere — it is listening ]</div>
  <div class="controls">
    <button class="btn find" id="findBtn">👁 let it find you</button>
    <button class="btn" id="shareBtn">share the curse</button>
  </div>
</div>

<div class="scare" id="scare">
  <div class="redflash"></div>
  <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="120" rx="82" ry="102" fill="#e9e7e1"/>
    <ellipse cx="72" cy="98" rx="20" ry="30" fill="#000"/>
    <ellipse cx="128" cy="98" rx="20" ry="30" fill="#000"/>
    <circle cx="72" cy="104" r="5" fill="#b30000"/>
    <circle cx="128" cy="104" r="5" fill="#b30000"/>
    <ellipse cx="100" cy="170" rx="34" ry="52" fill="#000"/>
    <ellipse cx="100" cy="150" rx="14" ry="26" fill="#5a0000"/>
  </svg>
</div>

<div class="staticflash" id="staticflash"></div>
<div class="scanlines"></div>
<div class="flicker"></div>
<div class="vignette"></div>

<div class="veil" id="veil">
  <div class="big">DO NOT OPEN</div>
  <div class="small">tap if you must</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const whisperEl = document.getElementById('whisper');
  const timerEl = document.getElementById('timer');
  const flash = document.getElementById('staticflash');
  const veil = document.getElementById('veil');
  const scare = document.getElementById('scare');
  const findBtn = document.getElementById('findBtn');
  const shareBtn = document.getElementById('shareBtn');

  // ── Whispers ──
  const lines = [
    "behind you", "it already knows", "you left the door open", "they are counting",
    "don't look up", "this was always the ending", "it hears the screen",
    "you can still feel it", "no one is coming", "the numbers were never yours"
  ];
  function whisperLoop() {
    const l = lines[Math.floor(Math.random()*lines.length)];
    whisperEl.style.opacity = '0';
    setTimeout(() => { whisperEl.textContent = l; whisperEl.style.opacity = '0.8'; }, 300);
    setTimeout(() => { whisperEl.style.opacity = '0'; }, 2600);
    setTimeout(whisperLoop, 4000 + Math.random()*3500);
  }
  whisperLoop();

  // ── Static flash ──
  function flashLoop() {
    flash.style.opacity = (0.04 + Math.random()*0.12).toFixed(3);
    setTimeout(() => flash.style.opacity = '0', 60 + Math.random()*90);
    setTimeout(flashLoop, 2500 + Math.random()*5000);
  }
  flashLoop();

  // ── Timer ──
  let seconds = 0, started = false;
  function fmt(s) {
    const m = Math.floor(s/60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function tickTimer() {
    seconds++;
    timerEl.textContent = 'you have been here ' + fmt(seconds);
  }
  function startTimer() { if (!started) { started = true; setInterval(tickTimer, 1000); } }

  // ── Audio (dread + scream) ──
  let audioCtx = null, droneGain = null, beatTimer = null, audioReady = false;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function startDread() {
    ensureAudio();
    if (audioReady || !audioCtx) return;
    audioReady = true;
    try {
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      droneGain = audioCtx.createGain();
      droneGain.gain.value = 0.0;
      osc.type = 'sine'; osc.frequency.value = 42;
      osc2.type = 'triangle'; osc2.frequency.value = 55;
      osc.connect(droneGain); osc2.connect(droneGain);
      droneGain.connect(audioCtx.destination);
      osc.start(); osc2.start();
      droneGain.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 4);
      let beat = 0;
      beatTimer = setInterval(() => { if (audioCtx) thump(beat % 2 === 0 ? 0.9 : 0.55); beat++; }, 1100);
    } catch (e) {}
  }
  function thump(vol) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 60; g.gain.value = 0;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.35);
    o.start(t); o.stop(t + 0.4);
  }
  function scream() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime, dur = 0.9;
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/data.length, 1.5);
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const ng = audioCtx.createGain(); ng.gain.value = 0.0;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 500;
    noise.connect(bp); bp.connect(ng); ng.connect(audioCtx.destination);
    ng.gain.setValueAtTime(0.9, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.start(t); noise.stop(t + dur);
    const o = audioCtx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(1000, t);
    o.frequency.exponentialRampToValueAtTime(160, t + 0.7);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.5, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(og); og.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.8);
  }

  // ── Jumpscare ──
  let scareCooldown = 0;
  function triggerScare() {
    if (scareCooldown > 0) return;
    scareCooldown = 5;
    scare.classList.add('on');
    scream();
    whisperEl.textContent = 'IT FOUND YOU';
    whisperEl.style.opacity = '0.9';
    setTimeout(() => { scare.classList.remove('on'); }, 750);
  }
  setInterval(() => { if (scareCooldown > 0) scareCooldown--; }, 1000);

  // Random scare on tapping the stage (desktop + mobile via pointerup)
  stage.addEventListener('pointerup', () => {
    ensureAudio();
    if (scareCooldown === 0 && Math.random() < 0.28) triggerScare();
  });

  // ── Share the curse (image) ──
  function makeCard() {
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 630;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, 1200, 630);
    const grad = x.createRadialGradient(600, 260, 60, 600, 260, 620);
    grad.addColorStop(0, 'rgba(40,0,0,0.5)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad; x.fillRect(0, 0, 1200, 630);
    x.textAlign = 'center';
    x.shadowColor = '#ff0000'; x.shadowBlur = 34;
    x.fillStyle = '#8b0000'; x.font = '900 140px "Courier New", monospace';
    x.fillText('GAME OVER', 600, 210);
    x.shadowBlur = 12; x.fillStyle = '#cccccc'; x.font = '44px "Courier New", monospace';
    x.fillText('you did this to yourself', 600, 300);
    x.fillStyle = '#ff2b2b'; x.font = '30px "Courier New", monospace';
    x.fillText('trapped for ' + fmt(seconds), 600, 360);
    x.fillStyle = '#555'; x.font = '24px "Courier New", monospace';
    x.fillText('[ there is no escape ]', 600, 430);
    return c;
  }
  shareBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const c = makeCard();
    try {
      const blob = await new Promise(res => c.toBlob(res, 'image/png'));
      const file = new File([blob], 'game-over.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'GAME OVER', text: 'you did this to yourself' });
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'game-over.png';
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (err) { /* user cancelled or unsupported */ }
  });

  findBtn.addEventListener('click', (e) => { e.stopPropagation(); ensureAudio(); triggerScare(); });

  // ── Veil reveal (unlocks audio + timer) ──
  function reveal() {
    veil.style.transition = 'opacity 0.8s ease';
    veil.style.opacity = '0';
    setTimeout(() => veil.remove(), 850);
    startDread();
    startTimer();
  }
  veil.addEventListener('click', reveal);
  veil.addEventListener('touchstart', ensureAudio, { passive: true });

  // ── Subtle glitch on move (desktop) ──
  document.addEventListener('mousemove', () => {
    if (Math.random() > 0.985) {
      document.body.style.filter = 'hue-rotate(' + (Math.random()*40-20) + 'deg) contrast(1.2)';
      setTimeout(() => document.body.style.filter = '', 90);
    }
  });
</script>
</body>
</html>
