<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GAME OVER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: "Courier New", Courier, monospace;
    background: #000;
    color: #b30000;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: crosshair;
  }

  /* ── Vignette ── */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.95) 100%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: 0.85; }
    50%     { opacity: 1; }
  }

  /* ── CRT scanlines ── */
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.35) 3px,
      rgba(0,0,0,0.35) 4px);
    mix-blend-mode: multiply;
  }
  .flicker {
    position: fixed; inset: 0; pointer-events: none; z-index: 7;
    background: rgba(20,0,0,0.06);
    animation: flick 4s steps(2) infinite;
  }
  @keyframes flick {
    0%,19%,21%,55%,57%,100% { opacity: 0.25; }
    20%,56% { opacity: 0.65; }
  }

  /* ── Stage ── */
  .stage {
    position: relative; z-index: 3;
    text-align: center; padding: 24px;
    width: 100%; max-width: 640px;
  }

  /* ── GAME OVER ── */
  .gameover {
    font-size: clamp(48px, 16vw, 130px);
    font-weight: 900; letter-spacing: 6px;
    color: #8b0000;
    text-shadow:
      0 0 6px #ff0000,
      0 0 22px rgba(255,0,0,0.55),
      3px 0 0 #3a0000,
      -3px 0 0 #5a0000;
    position: relative;
    animation: pulseText 2.4s ease-in-out infinite;
  }
  @keyframes pulseText {
    0%,100% { opacity: 0.82; transform: scale(1.00); }
    50%     { opacity: 1;    transform: scale(1.02); }
  }
  /* glitch clones */
  .gameover::before, .gameover::after {
    content: "GAME OVER";
    position: absolute; top: 0; left: 0; width: 100%;
    overflow: hidden;
  }
  .gameover::before {
    color: #00e0ff; left: 2px;
    text-shadow: none;
    clip-path: inset(0 0 0 0);
    animation: glitchTop 2.6s infinite linear alternate-reverse;
    opacity: 0.7;
  }
  .gameover::after {
    color: #ff003c; left: -2px;
    text-shadow: none;
    animation: glitchBot 1.9s infinite linear alternate-reverse;
    opacity: 0.7;
  }
  @keyframes glitchTop {
    0%   { clip-path: inset(0 0 85% 0); transform: translate(0,0); }
    20%  { clip-path: inset(20% 0 55% 0); transform: translate(-3px,0); }
    40%  { clip-path: inset(45% 0 35% 0); transform: translate(3px,0); }
    60%  { clip-path: inset(10% 0 75% 0); transform: translate(-2px,0); }
    80%  { clip-path: inset(60% 0 20% 0); transform: translate(2px,0); }
    100% { clip-path: inset(5% 0 80% 0);  transform: translate(0,0); }
  }
  @keyframes glitchBot {
    0%   { clip-path: inset(70% 0 5% 0);  transform: translate(0,0); }
    25%  { clip-path: inset(80% 0 8% 0);  transform: translate(3px,0); }
    50%  { clip-path: inset(55% 0 30% 0); transform: translate(-3px,0); }
    75%  { clip-path: inset(88% 0 2% 0);  transform: translate(2px,0); }
    100% { clip-path: inset(65% 0 12% 0); transform: translate(0,0); }
  }

  /* ── Blood drip under GAME OVER ── */
  .blood {
    margin: 14px auto 0; width: 60%; height: 60px; position: relative;
  }
  .blood::before {
    content: ""; position: absolute; top: 0; left: 50%;
    width: 3px; height: 100%;
    background: linear-gradient(to bottom, rgba(255,0,0,0.0), #8b0000 40%, #5a0000);
    transform: translateX(-50%);
    animation: drip 3.2s ease-in infinite;
  }
  .blood::after {
    content: ""; position: absolute; top: 0; left: 30%;
    width: 2px; height: 70%;
    background: linear-gradient(to bottom, rgba(255,0,0,0.0), #7a0000);
    animation: drip 4.1s ease-in infinite 1.2s;
  }
  @keyframes drip {
    0%   { height: 0; opacity: 0; }
    15%  { opacity: 1; }
    100% { height: 100%; opacity: 0.85; }
  }

  /* ── The line ── */
  .you {
    margin-top: 26px;
    font-size: clamp(18px, 5vw, 30px);
    color: #c9c9c9;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(180,0,0,0.6);
    animation: flickerText 3.3s infinite;
  }
  @keyframes flickerText {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 0.9; }
    20%, 24%, 55% { opacity: 0.18; }
    80% { opacity: 0.55; }
  }
  .you .em { color: #ff2b2b; text-shadow: 0 0 12px rgba(255,0,0,0.9); }

  /* ── Sub whispers ── */
  .whisper {
    margin-top: 30px;
    font-size: 13px; letter-spacing: 3px;
    color: #6a6a6a; min-height: 20px;
    text-transform: uppercase;
    transition: opacity 1.4s ease;
  }

  /* ── Press anything ── */
  .hint {
    margin-top: 34px; font-size: 12px; color: #444;
    letter-spacing: 2px; animation: pulseHint 2s ease-in-out infinite;
  }
  @keyframes pulseHint { 0%,100%{opacity:0.3;} 50%{opacity:0.8;} }

  /* ── Start veil (to unlock audio) ── */
  .veil {
    position: fixed; inset: 0; z-index: 50;
    background: #000; color: #5a0000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; text-align: center;
    cursor: pointer;
  }
  .veil .big {
    font-size: clamp(20px, 6vw, 34px); letter-spacing: 4px;
    color: #7a0000; text-shadow: 0 0 10px rgba(255,0,0,0.4);
    animation: pulseText 2s ease-in-out infinite;
  }
  .veil .small { font-size: 12px; color: #555; letter-spacing: 2px; }

  /* ── Static flash ── */
  .staticflash {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background: rgba(255,255,255,0.05);
    opacity: 0;
  }

  /* ── Faint breathing figure in the dark ── */
  .figure {
    position: fixed; right: 6%; bottom: 4%; z-index: 2;
    width: 120px; height: 200px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 25%, rgba(40,0,0,0.55) 0%, rgba(20,0,0,0.25) 35%, transparent 70%);
    border-radius: 50% 50% 45% 45%;
    filter: blur(3px);
    animation: figBreathe 6s ease-in-out infinite;
    opacity: 0.0;
  }
  @keyframes figBreathe {
    0%,100% { transform: scaleY(1); opacity: 0.35; }
    50%     { transform: scaleY(1.06); opacity: 0.6; }
  }
  .figure::before, .figure::after {
    content: ""; position: absolute; top: 26%; width: 9px; height: 9px;
    border-radius: 50%; background: rgba(255,0,0,0.7);
    box-shadow: 0 0 10px rgba(255,0,0,0.8);
    animation: blink 5s ease-in-out infinite;
  }
  .figure::before { left: 32%; }
  .figure::after  { left: 58%; }
  @keyframes blink {
    0%,92%,100% { opacity: 0.75; }
    95% { opacity: 0.05; }
  }
</style>
</head>
<body>

<div class="figure"></div>

<div class="stage" id="stage">
  <div class="gameover">GAME OVER</div>
  <div class="blood"></div>
  <div class="you">you did this to <span class="em">yourself</span></div>
  <div class="whisper" id="whisper"></div>
  <div class="hint">[ there is no escape ]</div>
</div>

<div class="staticflash" id="staticflash"></div>
<div class="scanlines"></div>
<div class="flicker"></div>
<div class="vignette"></div>

<div class="veil" id="veil">
  <div class="big">DO NOT OPEN</div>
  <div class="small">click if you must</div>
</div>

<script>
  // ── Whispers ──
  const lines = [
    "behind you",
    "it already knows",
    "you left the door open",
    "they are counting",
    "don't look up",
    "this was always the ending",
    "it hears the screen",
    "you can still feel it",
    "no one is coming",
    "the numbers were never yours"
  ];
  const whisperEl = document.getElementById('whisper');
  function whisperLoop() {
    const l = lines[Math.floor(Math.random()*lines.length)];
    whisperEl.style.opacity = '0';
    setTimeout(() => {
      whisperEl.textContent = l;
      whisperEl.style.opacity = '0.8';
    }, 300);
    setTimeout(() => { whisperEl.style.opacity = '0'; }, 2600);
    setTimeout(whisperLoop, 4000 + Math.random()*3500);
  }
  whisperLoop();

  // ── Occasional static flash ──
  const flash = document.getElementById('staticflash');
  function flashLoop() {
    flash.style.opacity = (0.04 + Math.random()*0.12).toFixed(3);
    setTimeout(() => flash.style.opacity = '0', 60 + Math.random()*90);
    setTimeout(flashLoop, 2500 + Math.random()*5000);
  }
  flashLoop();

  // ── Dread ambience via Web Audio (unlocked by the veil click) ──
  let audioCtx = null, droneGain = null, beatTimer = null;
  function startDread() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // low drone
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      droneGain = audioCtx.createGain();
      droneGain.gain.value = 0.0;
      osc.type = 'sine'; osc.frequency.value = 42;
      osc2.type = 'triangle'; osc2.frequency.value = 55;
      osc.connect(droneGain); osc2.connect(droneGain);
      droneGain.connect(audioCtx.destination);
      osc.start(); osc2.start();
      droneGain.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 4);

      // heartbeat
      let beat = 0;
      beatTimer = setInterval(() => {
        if (!audioCtx) return;
        thump(beat % 2 === 0 ? 0.9 : 0.55);
        beat++;
      }, 1100);
    } catch (e) { /* audio not available */ }
  }
  function thump(vol) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 60;
    g.gain.value = 0;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.35);
    o.start(t); o.stop(t + 0.4);
  }

  // ── Veil reveal ──
  const veil = document.getElementById('veil');
  veil.addEventListener('click', () => {
    veil.style.transition = 'opacity 0.8s ease';
    veil.style.opacity = '0';
    setTimeout(() => veil.remove(), 850);
    if (audioCtx === null) startDread();
  });

  // �─ subtle glitch on pointer move ──
  document.addEventListener('mousemove', () => {
    if (Math.random() > 0.985) {
      document.body.style.filter = 'hue-rotate(' + (Math.random()*40-20) + 'deg) contrast(1.2)';
      setTimeout(() => document.body.style.filter = '', 90);
    }
  });
</script>
</body>
</html>
